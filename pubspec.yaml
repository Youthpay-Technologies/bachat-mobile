name: bachat_mobile
description: Bachat expense tracking for teens and parents.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.10.3
  flutter_secure_storage: ^9.2.4
  sembast: ^3.8.5
  sembast_web: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.3
  uuid: ^4.5.1
  connectivity_plus: ^6.1.5
  hive: ^2.2.3         # Optional: for local database storage
  hive_flutter: ^1.1.0  # Optional: for local database storage
  another_telephony: ^0.4.1

dev_dependencies:
  http: ^1.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
